hiring:
  show: false
  text: "We're growing — [open positions](https://www.mpi.nl/career-education/vacancies?f%5B0%5D=job_offer_function_group%3A59224) for PhD candidates."

join_box:
  show: true
  heading: "Join the group"
  text: |
    **A note on enquiries.** I (Micha) receive a lot (and I mean *a lot*) of emails about internships, PhD and postdoc positions, more than I can read and reply to. **Please read the following before emailing me:**

    **PhD & postdoc:** Paid PhD and postdoc positions are **not available unless explicitly advertised**, here or on the [MPI vacancies page](https://www.mpi.nl/career-education/vacancies?f%5B0%5D=job_offer_function_group%3A59224). I can no longer reply to general PhD or postdoc enquiries. Please only get in touch if you have a **concrete source of funding** in mind or to apply to.

    **MSc:** I’m looking for students in AI, or in cognitive science or neuroscience **with concrete experience in NeuroAI**. International students not yet based in the Netherlands are only considered in exceptional cases, because of the extra supervision and start-up costs. If that’s you, please make clear why you would be a particularly strong fit for the group.

    **BSc:** I do **not supervise bachelor students**.

    If, after reading all this, you think you’d be a great addition to the group, I’d love to hear from you: email me (Micha). The number of requests is sometimes overwhelming, so please bear with me if I’m slow to reply.
